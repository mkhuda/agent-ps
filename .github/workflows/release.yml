name: release

# Publishing happens from a tag on a clean runner rather than from a laptop, so
# what reaches PyPI is exactly what the tag contains. Nothing here holds a
# credential: PyPI trusts this repository and workflow directly.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: the tag says what the source says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches the version in the package
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src=$(python -c "import agent_ps; print(agent_ps.VERSION)")
          if [ "$tag" != "$src" ]; then
            echo "tag is $tag but agent_ps says $src" >&2
            exit 1
          fi
          grep -q "## $src" CHANGELOG.md || {
            echo "CHANGELOG.md has no entry for $src" >&2; exit 1; }

      - name: Committed executable matches the source
        run: |
          sha256sum agent-ps > committed.txt
          ./build.sh
          sha256sum -c committed.txt

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist

      - name: The built command runs
        run: |
          python -m pip install --quiet dist/*.whl
          agent-ps --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # this is the whole credential: a short lived token minted for this run
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: attach the executable to the release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the checksum alongside it
        run: sha256sum agent-ps > SHA256SUMS
      # the release page says what the changelog says. Generated notes are the
      # commit list, which describes the release to a machine rather than to
      # someone deciding whether to upgrade.
      - name: Title and notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release_notes.py "$version" --title > title.txt
          python3 scripts/release_notes.py "$version" --notes > notes.md
          echo "title: $(cat title.txt)"
          test -s notes.md || { echo "no notes for $version" >&2; exit 1; }

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" agent-ps SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$(cat title.txt)" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" agent-ps SHA256SUMS \
              --title "$(cat title.txt)" --notes-file notes.md
          fi
