name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every module
        run: python -m compileall -q agent_ps
      # the session formats are nobody's public interface, so these are what
      # notice when an agent quietly changes one
      - name: Every backend against the store its agent would write
        run: python -m unittest discover -s tests -v
      - name: Run against a home with no agents
        env:
          HOME: ${{ runner.temp }}/empty-home
        run: |
          mkdir -p "$HOME"
          python -m agent_ps agents
          python -m agent_ps list

  artifact:
    name: committed executable matches the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the build is reproducible, so rebuilding an unchanged tree must produce
      # the file that is already committed. This is what stops the executable
      # people curl from drifting away from the code they can read.
      - name: Rebuild and compare
        run: |
          sha256sum agent-ps > committed.txt
          ./build.sh
          sha256sum -c committed.txt
      - name: Checksum in the README is current
        run: |
          grep -qF "$(sha256sum agent-ps | cut -d' ' -f1)" README.md
      # three files carry the version and they are edited by hand, so the only
      # question is when they drift, not whether
      - name: Versions agree
        run: |
          python - <<'EOF'
          import json, re, sys
          pkg = json.load(open("package.json"))["version"]
          src = re.search(r'VERSION = "([^"]+)"', open("agent_ps/__init__.py").read())[1]
          if pkg != src:
              sys.exit(f"package.json says {pkg}, agent_ps says {src}")
          if f"## {src}" not in open("CHANGELOG.md").read():
              sys.exit(f"CHANGELOG.md has no entry for {src}")
          print(f"all three say {src}")
          EOF
      - name: The npm shim runs the zipapp
        run: node npm/agent-ps.js --version
      - name: The wheel builds and its command works
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist
          python -m pip install --quiet dist/*.whl
          agent-ps --version
